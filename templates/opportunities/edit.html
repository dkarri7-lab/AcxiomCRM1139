{% extends 'layout/base.html' %}
{% block header_title %}Edit Opportunity{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-pen me-2 text-warning"></i>Modify Opportunity Stage & Details</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('opportunity.edit', id=opportunity.id) }}" method="POST" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Opportunity Name *</label>
                    <input type="text" name="opportunity_name" class="form-control bg-dark border-secondary text-white" value="{{ opportunity.opportunity_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Customer Account</label>
                    <select name="customer_id" class="form-select bg-dark border-secondary text-white">
                        <option value="">Select Customer...</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}" {% if c.id == opportunity.customer_id %}selected{% endif %}>{{ c.customer_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Opportunity Amount ($) *</label>
                    <input type="number" step="0.01" min="0.01" name="amount" class="form-control bg-dark border-secondary text-white" value="{{ opportunity.amount }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Probability (%) *</label>
                    <input type="number" min="0" max="100" name="probability" class="form-control bg-dark border-secondary text-white" value="{{ opportunity.probability }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Pipeline Stage *</label>
                    <select name="stage" class="form-select bg-dark border-secondary text-white">
                        <option value="Qualification" {% if opportunity.stage == 'Qualification' %}selected{% endif %}>Qualification</option>
                        <option value="Proposal" {% if opportunity.stage == 'Proposal' %}selected{% endif %}>Proposal</option>
                        <option value="Negotiation" {% if opportunity.stage == 'Negotiation' %}selected{% endif %}>Negotiation</option>
                        <option value="Won" {% if opportunity.stage == 'Won' %}selected{% endif %}>Won</option>
                        <option value="Lost" {% if opportunity.stage == 'Lost' %}selected{% endif %}>Lost</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Expected Close Date *</label>
                    <input type="date" name="expected_close_date" class="form-control bg-dark border-secondary text-white" value="{{ opportunity.expected_close_date.strftime('%Y-%m-%d') if opportunity.expected_close_date else '' }}" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Assigned Owner</label>
                    <select name="owner_id" class="form-select bg-dark border-secondary text-white">
                        {% for u in sales_execs %}
                        <option value="{{ u.id }}" {% if u.id == opportunity.owner_id %}selected{% endif %}>{{ u.name }} ({{ u.role.role_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control bg-dark border-secondary text-white" rows="3">{{ opportunity.notes or '' }}</textarea>
                </div>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('opportunity.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-warning"><i class="fa-solid fa-save me-1"></i> Update Opportunity</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
