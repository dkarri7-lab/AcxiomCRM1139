{% extends 'layout/base.html' %}
{% block header_title %}Create Opportunity{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-briefcase me-2 text-primary"></i>New Opportunity Details</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('opportunity.create') }}" method="POST" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Opportunity Name *</label>
                    <input type="text" name="opportunity_name" class="form-control bg-dark border-secondary text-white" placeholder="Enterprise License Renewal" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Customer Account</label>
                    <select name="customer_id" class="form-select bg-dark border-secondary text-white">
                        <option value="">Select Customer...</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}" {% if request.args.get('customer_id')|int == c.id %}selected{% endif %}>{{ c.customer_name }} ({{ c.customer_code }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Opportunity Amount ($) *</label>
                    <input type="number" step="0.01" min="0.01" name="amount" class="form-control bg-dark border-secondary text-white" placeholder="15000.00" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Probability (%) (0 - 100) *</label>
                    <input type="number" min="0" max="100" name="probability" class="form-control bg-dark border-secondary text-white" value="20" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Pipeline Stage *</label>
                    <select name="stage" class="form-select bg-dark border-secondary text-white">
                        <option value="Qualification">Qualification</option>
                        <option value="Proposal">Proposal</option>
                        <option value="Negotiation">Negotiation</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Expected Close Date *</label>
                    <input type="date" name="expected_close_date" class="form-control bg-dark border-secondary text-white" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Assigned Sales Executive</label>
                    <select name="owner_id" class="form-select bg-dark border-secondary text-white">
                        {% for u in sales_execs %}
                        <option value="{{ u.id }}" {% if u.id == session.get('user_id') %}selected{% endif %}>{{ u.name }} ({{ u.role.role_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Notes / Requirements</label>
                    <textarea name="notes" class="form-control bg-dark border-secondary text-white" rows="3"></textarea>
                </div>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('opportunity.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary-custom"><i class="fa-solid fa-save me-1"></i> Save Opportunity</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
