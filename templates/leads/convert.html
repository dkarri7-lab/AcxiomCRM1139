{% extends 'layout/base.html' %}
{% block header_title %}Convert Qualified Lead{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 650px; margin: 0 auto;">
    <div class="card-header bg-success text-white">
        <span><i class="fa-solid fa-right-left me-2"></i>Convert Lead to Customer & Opportunity</span>
    </div>
    <div class="card-body">
        <div class="alert alert-dark border-secondary mb-4">
            <h5 class="text-white mb-1"><i class="fa-solid fa-user text-primary me-2"></i>{{ lead.lead_name }}</h5>
            <p class="text-muted small mb-0">Email: {{ lead.email }} | Phone: {{ lead.phone }} | Company: {{ lead.company_name or 'N/A' }}</p>
        </div>

        <form action="{{ url_for('lead.convert', id=lead.id) }}" method="POST" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Opportunity Name *</label>
                <input type="text" name="opportunity_name" class="form-control bg-dark border-secondary text-white" value="{{ lead.company_name or lead.lead_name }} - Expansion Deal" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Opportunity Amount ($) *</label>
                <input type="number" step="0.01" min="1" name="amount" class="form-control bg-dark border-secondary text-white" value="{{ lead.expected_value or 10000 }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Expected Close Date *</label>
                <input type="date" name="expected_close_date" class="form-control bg-dark border-secondary text-white" required>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('lead.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-check-double me-1"></i> Confirm Lead Conversion</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
