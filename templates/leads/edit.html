{% extends 'layout/base.html' %}
{% block header_title %}Edit Lead Details{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-pen me-2 text-warning"></i>Modify Lead</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('lead.edit', id=lead.id) }}" method="POST" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Lead Name *</label>
                    <input type="text" name="lead_name" class="form-control bg-dark border-secondary text-white" value="{{ lead.lead_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Company Name</label>
                    <input type="text" name="company_name" class="form-control bg-dark border-secondary text-white" value="{{ lead.company_name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Email Address *</label>
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-white" value="{{ lead.email }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Phone Number *</label>
                    <input type="text" name="phone" class="form-control bg-dark border-secondary text-white" value="{{ lead.phone }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">Lead Source</label>
                    <select name="source" class="form-select bg-dark border-secondary text-white">
                        <option value="Web" {% if lead.source == 'Web' %}selected{% endif %}>Website</option>
                        <option value="Referral" {% if lead.source == 'Referral' %}selected{% endif %}>Referral</option>
                        <option value="Campaign" {% if lead.source == 'Campaign' %}selected{% endif %}>Campaign</option>
                        <option value="Cold Call" {% if lead.source == 'Cold Call' %}selected{% endif %}>Cold Call</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">Lead Status</label>
                    <select name="status" class="form-select bg-dark border-secondary text-white">
                        <option value="New" {% if lead.status == 'New' %}selected{% endif %}>New</option>
                        <option value="Contacted" {% if lead.status == 'Contacted' %}selected{% endif %}>Contacted</option>
                        <option value="Qualified" {% if lead.status == 'Qualified' %}selected{% endif %}>Qualified</option>
                        <option value="Unqualified" {% if lead.status == 'Unqualified' %}selected{% endif %}>Unqualified</option>
                        <option value="Converted" {% if lead.status == 'Converted' %}selected{% endif %}>Converted</option>
                        <option value="Lost" {% if lead.status == 'Lost' %}selected{% endif %}>Lost</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">Expected Value ($)</label>
                    <input type="number" step="0.01" min="0" name="expected_value" class="form-control bg-dark border-secondary text-white" value="{{ lead.expected_value }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Assigned Owner</label>
                    <select name="owner_id" class="form-select bg-dark border-secondary text-white">
                        {% for u in sales_execs %}
                        <option value="{{ u.id }}" {% if u.id == lead.owner_id %}selected{% endif %}>{{ u.name }} ({{ u.role.role_name }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('lead.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-warning"><i class="fa-solid fa-save me-1"></i> Update Lead</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
