{% extends 'layout/base.html' %}
{% block header_title %}Create User Account{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 650px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-user-plus me-2 text-indigo-400"></i>New User Account</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('user.create') }}" method="POST" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Full Name *</label>
                <input type="text" name="name" class="form-control bg-dark border-secondary text-white" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Email Address *</label>
                <input type="email" name="email" class="form-control bg-dark border-secondary text-white" placeholder="john@acxiom.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Password * (Min 8 chars, A-Z, a-z, 0-9, special char)</label>
                <input type="password" name="password" class="form-control bg-dark border-secondary text-white" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-gray-300 small fw-semibold">Primary Role *</label>
                <select name="role_id" class="form-select bg-dark border-secondary text-white" required>
                    {% for r in roles %}
                    <option value="{{ r.id }}">{{ r.role_name }} - {{ r.description }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                <label class="form-check-input-label text-white" for="isActive">Account Active</label>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('user.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary-custom"><i class="fa-solid fa-save me-1"></i> Create User</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
