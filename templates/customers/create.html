{% extends 'layout/base.html' %}
{% block header_title %}Create Customer{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-user-plus me-2 text-info"></i>Add New Customer</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('customer.create') }}" method="POST" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Customer Name *</label>
                    <input type="text" name="customer_name" class="form-control bg-dark border-secondary text-white" placeholder="Acme Corp / John Doe" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Company Name</label>
                    <input type="text" name="company_name" class="form-control bg-dark border-secondary text-white" placeholder="Company Enterprises">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Email Address *</label>
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-white" placeholder="customer@example.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Phone Number *</label>
                    <input type="text" name="phone" class="form-control bg-dark border-secondary text-white" placeholder="9876543210" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Street Address</label>
                    <input type="text" name="address" class="form-control bg-dark border-secondary text-white" placeholder="123 Financial District">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">City</label>
                    <input type="text" name="city" class="form-control bg-dark border-secondary text-white" placeholder="Mumbai / New York">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">State</label>
                    <input type="text" name="state" class="form-control bg-dark border-secondary text-white" placeholder="Maharashtra / NY">
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Assigned Sales Executive</label>
                    <select name="owner_id" class="form-select bg-dark border-secondary text-white">
                        {% for u in sales_execs %}
                        <option value="{{ u.id }}" {% if u.id == session.get('user_id') %}selected{% endif %}>{{ u.name }} ({{ u.role.role_name }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('customer.index') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary-custom"><i class="fa-solid fa-save me-1"></i> Save Customer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
