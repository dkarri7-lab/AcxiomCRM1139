{% extends 'layout/base.html' %}
{% block header_title %}Edit Customer Profile{% endblock %}

{% block content %}
<div class="card card-custom" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <span><i class="fa-solid fa-pen me-2 text-warning"></i>Edit Customer Details</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('customer.edit', id=customer.id) }}" method="POST" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Customer Name *</label>
                    <input type="text" name="customer_name" class="form-control bg-dark border-secondary text-white" value="{{ customer.customer_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Company Name</label>
                    <input type="text" name="company_name" class="form-control bg-dark border-secondary text-white" value="{{ customer.company_name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Email Address *</label>
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-white" value="{{ customer.email }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-gray-300 small fw-semibold">Phone Number *</label>
                    <input type="text" name="phone" class="form-control bg-dark border-secondary text-white" value="{{ customer.phone }}" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Street Address</label>
                    <input type="text" name="address" class="form-control bg-dark border-secondary text-white" value="{{ customer.address or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">City</label>
                    <input type="text" name="city" class="form-control bg-dark border-secondary text-white" value="{{ customer.city or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">State</label>
                    <input type="text" name="state" class="form-control bg-dark border-secondary text-white" value="{{ customer.state or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-gray-300 small fw-semibold">Status</label>
                    <select name="status" class="form-select bg-dark border-secondary text-white">
                        <option value="Active" {% if customer.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if customer.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label text-gray-300 small fw-semibold">Assigned Sales Executive</label>
                    <select name="owner_id" class="form-select bg-dark border-secondary text-white">
                        {% for u in sales_execs %}
                        <option value="{{ u.id }}" {% if u.id == customer.owner_id %}selected{% endif %}>{{ u.name }} ({{ u.role.role_name }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4 text-end">
                <a href="{{ url_for('customer.details', id=customer.id) }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-warning"><i class="fa-solid fa-save me-1"></i> Update Customer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
